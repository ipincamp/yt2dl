<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YT2DL - YouTube Downloader</title>

    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 0.95em;
        }

        .content {
            padding: 30px;
        }

        .input-section {
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-download {
            background: #10b981;
            color: white;
            width: 100%;
        }

        .btn-download:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4);
        }

        .video-details {
            display: none;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .video-details.show {
            display: block;
        }

        .video-info {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }

        .thumbnail-container {
            flex-shrink: 0;
        }

        .thumbnail {
            width: 200px;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .video-meta {
            flex: 1;
        }

        .video-title {
            font-size: 1.3em;
            font-weight: 700;
            margin-bottom: 12px;
            color: #1f2937;
            line-height: 1.4;
        }

        .meta-item {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            color: #6b7280;
            font-size: 0.95em;
        }

        .meta-label {
            font-weight: 600;
            color: #374151;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid #e5e7eb;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            padding: 14px;
            text-align: center;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            color: #6b7280;
            transition: all 0.3s;
            position: relative;
        }

        .tab:hover {
            color: #667eea;
        }

        .tab.active {
            color: #667eea;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .format-list {
            display: grid;
            gap: 12px;
        }

        .format-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .format-item:hover {
            border-color: #667eea;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.1);
        }

        .format-item.selected {
            border-color: #667eea;
            background: #eff6ff;
        }

        .format-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .format-quality {
            font-weight: 600;
            color: #1f2937;
            font-size: 1.05em;
        }

        .format-details {
            font-size: 0.85em;
            color: #6b7280;
        }

        .format-size {
            font-weight: 600;
            color: #667eea;
        }

        .waiting-area {
            display: none;
            text-align: center;
            padding: 40px 20px;
            background: #f8f9fa;
            border-radius: 12px;
            margin-top: 20px;
        }

        .waiting-area.show {
            display: block;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e5e7eb;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .waiting-text {
            font-size: 1.1em;
            color: #6b7280;
            margin-bottom: 10px;
        }

        .waiting-status {
            font-size: 0.9em;
            color: #9ca3af;
        }

        .download-ready {
            display: none;
        }

        .download-ready.show {
            display: block;
        }

        .download-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .error-message {
            display: none;
            padding: 14px 18px;
            background: #fee;
            border: 1px solid #fcc;
            border-radius: 8px;
            color: #c33;
            margin-top: 10px;
        }

        .error-message.show {
            display: block;
        }

        @media (max-width: 640px) {
            .video-info {
                flex-direction: column;
            }

            .thumbnail {
                width: 100%;
            }

            .input-group {
                flex-direction: column;
            }

            .tabs {
                flex-direction: column;
            }

            .tab.active::after {
                left: 0;
                right: auto;
                width: 4px;
                height: 100%;
                bottom: 0;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🎬 YouTube Downloader</h1>
            <p>Download your favorite videos in high quality</p>
        </div>

        <div class="content">
            <!-- Input Section -->
            <div class="input-section">
                <div class="input-group">
                    <input type="text" id="youtubeUrl" placeholder="Paste YouTube URL here..." aria-label="YouTube URL">
                    <button class="btn btn-primary" id="fetchBtn" onclick="fetchVideoInfo()">
                        Get Info
                    </button>
                </div>
                <div class="error-message" id="errorMessage"></div>
            </div>

            <!-- Video Details Section -->
            <div class="video-details" id="videoDetails">
                <div class="video-info">
                    <div class="thumbnail-container">
                        <img id="thumbnail" class="thumbnail" src="" alt="Video thumbnail">
                    </div>
                    <div class="video-meta">
                        <div class="video-title" id="videoTitle"></div>
                        <div class="meta-item">
                            <span class="meta-label">Author:</span>
                            <span id="videoAuthor"></span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Duration:</span>
                            <span id="videoDuration"></span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Published:</span>
                            <span id="videoPublished"></span>
                        </div>
                    </div>
                </div>

                <!-- Tabs -->
                <div class="tabs">
                    <button class="tab active" onclick="switchTab('bundle')">Bundle (Video + Audio)</button>
                    <button class="tab" onclick="switchTab('video')">Video Only</button>
                    <button class="tab" onclick="switchTab('audio')">Audio Only</button>
                </div>

                <!-- Tab Contents -->
                <div id="bundleTab" class="tab-content active">
                    <div class="format-list" id="bundleFormats"></div>
                </div>

                <div id="videoTab" class="tab-content">
                    <div class="format-list" id="videoFormats"></div>
                </div>

                <div id="audioTab" class="tab-content">
                    <div class="format-list" id="audioFormats"></div>
                </div>
            </div>

            <!-- Waiting Area -->
            <div class="waiting-area" id="waitingArea">
                <div class="spinner" id="spinner"></div>
                <div class="waiting-text" id="waitingText">Processing your request...</div>
                <div class="waiting-status" id="waitingStatus">Please wait</div>

                <div class="download-ready" id="downloadReady">
                    <div class="download-icon">✅</div>
                    <div class="waiting-text">Your download is ready!</div>
                    <button class="btn btn-download" id="downloadBtn" onclick="downloadFile()">
                        📥 Download Now
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedFormat = null;
        let videoData = null;
        let downloadUrl = null;

        // Fetch video information
        async function fetchVideoInfo() {
            const urlInput = document.getElementById('youtubeUrl');
            const url = urlInput.value.trim();

            if (!url) {
                showError('Please enter a YouTube URL');
                return;
            }

            // Validate YouTube URL
            if (!isValidYouTubeUrl(url)) {
                showError('Please enter a valid YouTube URL');
                return;
            }

            hideError();
            showWaiting('Fetching video information...', 'This may take a few seconds');

            try {
                // Call your API endpoint here
                const response = await fetch(`/api/video-info?url=${encodeURIComponent(url)}`);

                if (!response.ok) {
                    throw new Error('Failed to fetch video information');
                }

                const result = await response.json();

                if (!result.status || !result.data) {
                    throw new Error(result.message || 'Invalid response from server');
                }

                videoData = result.data;
                displayVideoInfo(videoData);
                hideWaiting();

            } catch (error) {
                hideWaiting();
                showError('Failed to fetch video information. Please try again.');
                console.error('Error:', error);
            }
        }

        // Display video information
        function displayVideoInfo(data) {
            document.getElementById('videoTitle').textContent = data.title || 'Unknown Title';
            document.getElementById('thumbnail').src = data.thumbnail || '';
            document.getElementById('videoAuthor').textContent = data.author || 'Unknown';
            document.getElementById('videoDuration').textContent = formatDuration(data.duration) || 'N/A';
            document.getElementById('videoPublished').textContent = formatDate(data.publishedDate) || 'N/A';

            // Populate formats
            populateFormats('bundleFormats', data.formats?.bundle || []);
            populateFormats('videoFormats', data.formats?.video || []);
            populateFormats('audioFormats', data.formats?.audio || []);

            document.getElementById('videoDetails').classList.add('show');
        }

        // Populate format lists
        function populateFormats(containerId, formats) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            if (!formats || formats.length === 0) {
                container.innerHTML = '<p style="color: #6b7280; padding: 20px; text-align: center;">No formats available</p>';
                return;
            }

            formats.forEach((format, index) => {
                const formatItem = document.createElement('div');
                formatItem.className = 'format-item';
                formatItem.onclick = () => selectFormat(containerId, index, format);

                const quality = format.quality || format.qualityLabel || 'Unknown';
                const codec = format.codec || '';
                const fps = format.fps ? `${format.fps}fps` : '';
                const bitrate = format.bitrate || '';
                const size = format.size || 'Unknown size';

                const details = [codec, fps, bitrate].filter(d => d).join(' • ');

                formatItem.innerHTML = `
                    <div class="format-info">
                        <div class="format-quality">${quality}</div>
                        ${details ? `<div class="format-details">${details}</div>` : ''}
                    </div>
                    <div class="format-size">${size}</div>
                `;

                container.appendChild(formatItem);
            });
        }

        // Select format
        function selectFormat(containerId, index, format) {
            console.log('Format selected:', format);

            // Remove previous selection
            document.querySelectorAll(`#${containerId} .format-item`).forEach(item => {
                item.classList.remove('selected');
            });

            // Add selection to clicked item
            document.querySelectorAll(`#${containerId} .format-item`)[index].classList.add('selected');
            selectedFormat = format;

            // Show download ready immediately
            showDownloadReady();
        }

        // Download file
        async function downloadFile() {
            console.log('Download button clicked');
            console.log('Selected format:', selectedFormat);
            console.log('YouTube URL:', document.getElementById('youtubeUrl').value);

            if (!selectedFormat) {
                showError('Please select a format first');
                return;
            }

            if (!selectedFormat.token) {
                showError('Invalid format token');
                console.error('Format missing token:', selectedFormat);
                return;
            }

            try {
                // Show loading state
                showWaiting('Preparing download...', 'Please wait');

                const url = document.getElementById('youtubeUrl').value;
                const token = selectedFormat.token;

                console.log('Making download request with:', { url, token });

                // Make the download request
                const response = await fetch('/api/download', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ url, token })
                });

                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({ message: 'Unknown error' }));
                    throw new Error(errorData.message || `Server error: ${response.status}`);
                }

                // Get the blob from response
                const blob = await response.blob();
                console.log('Blob received, size:', blob.size);

                // Create download link
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = downloadUrl;

                // Get filename from Content-Disposition header
                const contentDisposition = response.headers.get('Content-Disposition');
                let filename = 'download';
                if (contentDisposition) {
                    const filenameMatch = contentDisposition.match(/filename="(.+)"/);
                    if (filenameMatch) {
                        filename = filenameMatch[1];
                    }
                }
                a.download = filename;

                console.log('Starting download:', filename);

                // Trigger download
                document.body.appendChild(a);
                a.click();

                // Cleanup
                setTimeout(() => {
                    window.URL.revokeObjectURL(downloadUrl);
                    document.body.removeChild(a);
                }, 100);

                // Show success
                hideWaiting();
                showWaiting('Download started!', 'Check your downloads folder');
                setTimeout(() => {
                    hideWaiting();
                }, 3000);

            } catch (error) {
                console.error('Download error:', error);
                console.error('Error stack:', error.stack);
                hideWaiting();
                showError(`Download failed: ${error.message}`);
                
                // Show download button again so user can retry
                showDownloadReady();
            }
        }

        // Switch tabs
        function switchTab(tabName) {
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');

            // Update tab contents
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });

            const tabMap = {
                'bundle': 'bundleTab',
                'video': 'videoTab',
                'audio': 'audioTab'
            };

            document.getElementById(tabMap[tabName]).classList.add('active');
        }

        // Show waiting area
        function showWaiting(text, status) {
            console.log('showWaiting called:', text, status);
            const waitingText = document.getElementById('waitingText');
            const waitingStatus = document.getElementById('waitingStatus');
            const spinner = document.getElementById('spinner');
            const downloadReady = document.getElementById('downloadReady');
            const waitingArea = document.getElementById('waitingArea');
            
            // Reset all visibility
            waitingText.style.display = 'block';
            waitingStatus.style.display = 'block';
            spinner.style.display = 'block';
            downloadReady.classList.remove('show');
            
            // Set text content
            waitingText.textContent = text;
            waitingStatus.textContent = status;
            
            // Show waiting area
            waitingArea.classList.add('show');
        }

        // Hide waiting area
        function hideWaiting() {
            console.log('hideWaiting called');
            document.getElementById('waitingArea').classList.remove('show');
        }

        // Show download ready
        function showDownloadReady() {
            console.log('showDownloadReady called');
            const spinner = document.getElementById('spinner');
            const waitingText = document.getElementById('waitingText');
            const waitingStatus = document.getElementById('waitingStatus');
            const downloadReady = document.getElementById('downloadReady');
            const waitingArea = document.getElementById('waitingArea');
            
            // Hide loading elements
            spinner.style.display = 'none';
            waitingText.style.display = 'none';
            waitingStatus.style.display = 'none';
            
            // Show download button
            downloadReady.classList.add('show');
            waitingArea.classList.add('show');
        }

        // Show error
        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.classList.add('show');
        }

        // Hide error
        function hideError() {
            document.getElementById('errorMessage').classList.remove('show');
        }

        // Validate YouTube URL
        function isValidYouTubeUrl(url) {
            const patterns = [
                /^(https?:\/\/)?(www\.)?(youtube\.com\/watch\?v=|youtu\.be\/)[\w-]+/,
                /^(https?:\/\/)?(www\.)?youtube\.com\/shorts\/[\w-]+/
            ];
            return patterns.some(pattern => pattern.test(url));
        }

        // Format duration
        function formatDuration(seconds) {
            if (!seconds) return 'N/A';
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;

            if (hours > 0) {
                return `${hours}:${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }
            return `${minutes}:${String(secs).padStart(2, '0')}`;
        }

        // Format date
        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        // Allow Enter key to submit
        document.getElementById('youtubeUrl').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                fetchVideoInfo();
            }
        });
    </script>
</body>

</html>
